<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冬冬杯官网</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-muted: rgba(255, 255, 255, 0.3);
            --accent: rgba(255, 255, 255, 0.85);
            --accent-glow: rgba(255, 255, 255, 0.1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #050508;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated background mesh gradient */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-mesh::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse 60% 50% at 20% 40%, rgba(60, 60, 80, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 80% 60%, rgba(40, 40, 60, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 50% 80%, rgba(50, 50, 70, 0.08) 0%, transparent 60%);
            animation: meshDrift 20s ease-in-out infinite alternate;
        }

        @keyframes meshDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        /* Floating orbs for depth */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(100, 100, 140, 0.3);
            top: 10%;
            left: -5%;
            animation: orbFloat1 15s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(80, 80, 120, 0.25);
            top: 50%;
            right: -5%;
            animation: orbFloat2 18s ease-in-out infinite alternate;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: rgba(90, 90, 110, 0.2);
            bottom: 10%;
            left: 30%;
            animation: orbFloat3 12s ease-in-out infinite alternate;
        }

        @keyframes orbFloat1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, -40px) scale(1.1); }
        }

        @keyframes orbFloat2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, 30px) scale(1.15); }
        }

        @keyframes orbFloat3 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.05); }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 24px 40px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 56px;
            animation: fadeInDown 0.8s ease-out;
        }

        .title {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--text-primary);
            margin-bottom: 12px;
            text-shadow: 0 2px 30px rgba(255, 255, 255, 0.08);
        }

        .subtitle {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 20px auto 0;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 48px;
        }

        @media (max-width: 900px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 540px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Liquid Glass Card */
        .card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.08) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }

        /* Inner gradient glow */
        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.08) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: var(--glass-border-hover);
            box-shadow: 
                0 20px 60px -10px rgba(0, 0, 0, 0.5),
                0 0 30px -5px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .card:hover::after {
            opacity: 1;
        }

        /* Press effect */
        .card:active {
            transform: translateY(0) scale(0.97);
            transition: all 0.15s ease;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Card content layout */
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .card:hover .card-icon {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.85);
            transform: scale(1.05);
        }

        .card-number {
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.12);
            line-height: 1;
            letter-spacing: -0.02em;
            transition: color 0.3s ease;
        }

        .card:hover .card-number {
            color: rgba(255, 255, 255, 0.25);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 400;
        }

        /* Card link buttons */
        .card-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .card-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .card-link:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateX(2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card-link:active {
            transform: scale(0.96);
        }

        .card-link-arrow {
            font-size: 11px;
            color: var(--text-muted);
            transition: transform 0.25s ease;
        }

        .card-link:hover .card-link-arrow {
            transform: translateX(3px);
            color: var(--text-secondary);
        }

        /* Staggered animation delays */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }
        .card:nth-child(7) { animation-delay: 0.7s; }
        .card:nth-child(8) { animation-delay: 0.8s; }
        .card:nth-child(9) { animation-delay: 0.9s; }
        /* Modal / Detail Panel */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-panel {
            position: relative;
            width: 100%;
            max-width: 640px;
            max-height: 85vh;
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 0;
            overflow: hidden;
            transform: scale(0.9) translateY(20px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 
                0 40px 100px -20px rgba(0, 0, 0, 0.7),
                0 0 60px -10px rgba(255, 255, 255, 0.05);
        }

        .modal-overlay.active .modal-panel {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 32px 0;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            font-size: 22px;
        }

        .modal-title-group {
            display: flex;
            flex-direction: column;
        }

        .modal-label {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 24px 32px 32px;
            overflow-y: auto;
            max-height: calc(85vh - 100px);
        }

        .modal-body::-webkit-scrollbar {
            width: 4px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Detail content styling */
        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-heading {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .detail-text {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .detail-list {
            list-style: none;
            padding: 0;
        }

        .detail-list li {
            position: relative;
            padding-left: 16px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .detail-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
        }

        .detail-sublist {
            list-style: none;
            margin-top: 8px;
            margin-bottom: 8px;
            padding-left: 8px;
        }

        .detail-sublist li {
            padding-left: 14px;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .detail-sublist li::before {
            content: '›';
            top: 0;
            width: auto;
            height: auto;
            background: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }

        .highlight-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            margin: 16px 0;
        }

        .highlight-box .label {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .reward-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .reward-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
        }

        .reward-rank {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .reward-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .reward-note {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .timeline-item {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .timeline-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 6px;
            flex-shrink: 0;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .timeline-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .bp-step {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: flex-start;
        }

        .bp-step-num {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .bp-step-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            padding-top: 4px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeInUp 0.8s ease-out 0.8s backwards;
        }

        .footer-text {
            font-size: 12px;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .footer-copyright {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.05em;
        }

        .footer-divider {
            width: 20px;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 16px auto;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile adjustments */
        @media (max-width: 640px) {
            .container {
                padding: 40px 16px 32px;
            }

            .card {
                padding: 22px;
                border-radius: 20px;
            }

            .modal-panel {
                max-height: 90vh;
                border-radius: 24px;
            }

            .modal-header {
                padding: 22px 24px 0;
            }

            .modal-body {
                padding: 20px 24px 24px;
            }

            .modal-title {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <!-- Background effects -->
    <div class="bg-mesh"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main Content -->
    <div class="container">
        <header class="header">
            <h1 class="title">冬冬杯第二届 · 暑期版</h1>
            <p class="subtitle">比赛会结束，水友们的故事不会。胜负有时，热爱无终。</p>
            <div class="divider"></div>
        </header>

        <div class="cards-grid" id="cardsGrid">
            <!-- Cards will be generated by JS -->
        </div>

        <footer class="footer">
            <p class="footer-text">
                本细则自发布之日起生效，所有报名参与本次冬冬杯的选手、管理组成员，<br>
                均视为已阅读并同意本细则全部条款，自愿遵守各项规定。<br>
                奖金将在比赛结束后七个工作日内发放
            </p>
            <div class="footer-divider"></div>
            <p class="footer-copyright">Copyright © 冬冬Soyona</p>
        </footer>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-header-left">
                    <div class="modal-icon" id="modalIcon"></div>
                    <div class="modal-title-group">
                        <div class="modal-label" id="modalLabel"></div>
                        <div class="modal-title" id="modalTitle"></div>
                    </div>
                </div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // Card data
        const cardsData = [
            {
                id: 1,
                icon: '🛡️',
                number: '01',
                title: '赛事 BP 规则',
                desc: '禁用流程与特殊解禁',
                label: '赛事 BP 规则',
                content: `
                    <div class="detail-section">
                        <div class="detail-heading">BP 流程</div>
                        <p class="detail-text" style="margin-bottom: 16px;">监管方总计禁用 5 名求生者、1 张地图；求生方禁用 2 名监管者、2 张地图。BP 顺序严格按以下步骤执行，全程需在 4 分钟内完成：</p>
                        <div class="bp-step">
                            <div class="bp-step-num">1</div>
                            <div class="bp-step-text">监管者先禁用 2 名求生者（30 秒）</div>
                        </div>
                        <div class="bp-step">
                            <div class="bp-step-num">2</div>
                            <div class="bp-step-text">求生者再禁用 1 名监管者、1 张地图（1 分钟）</div>
                        </div>
                        <div class="bp-step">
                            <div class="bp-step-num">3</div>
                            <div class="bp-step-text">监管者再禁用 2 名求生者（30 秒）</div>
                        </div>
                        <div class="bp-step">
                            <div class="bp-step-num">4</div>
                            <div class="bp-step-text">求生者再禁用 1 名监管、1 张地图（1 分钟）</div>
                        </div>
                        <div class="bp-step">
                            <div class="bp-step-num">5</div>
                            <div class="bp-step-text">监管者最后禁用 1 名求生者、1 张地图（1 分钟）</div>
                        </div>
                        <p class="detail-text" style="margin-top: 16px;">双方需在单场比赛开始前，按管理组指定流程完成禁用。</p>

        // Mouse tracking for glow effect
        function handleMouseMove(e, card) {
            const rect = card.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            card.style.setProperty('--mouse-x', x + '%');
            card.style.setProperty('--mouse-y', y + '%');
        }

        // Modal functions
        const modal = document.getElementById('modal');
        const modalIcon = document.getElementById('modalIcon');
        const modalLabel = document.getElementById('modalLabel');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        function openModal(card) {
            modalIcon.textContent = card.icon;
            modalLabel.textContent = `SECTION ${card.number}`;
            modalTitle.textContent = card.title;
            modalBody.innerHTML = card.content;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('touchstart', () => {
